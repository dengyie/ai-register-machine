[project]
name = "ai-register-machine"
version = "1.3.0"
description = "AI register machine: multi-provider hub, layered core, web control plane (Grok/xAI, MiMo, ChatGPT)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.15"
authors = [{ name = "dengyie" }]
keywords = ["ai-register", "register-machine", "automation", "grok", "xai", "mimo", "oidc", "cpa", "web"]
dependencies = [
    "DrissionPage>=4.1",
    "curl_cffi>=0.7",
    # Clash YAML convert (register_core.nodes.convert); CI uv sync must install it
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "patchright>=1.52",
    "slidex>=0.5.0",
    # Outlook provider HTTP clients — temp_mail (httpx) and outlook_oauth
    # (requests) hard-import these at module load; declared here (not dev-only)
    # so a clean prod install can load the email registry without ImportError.
    "httpx>=0.27",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/dengyie/ai-register-machine"
Repository = "https://github.com/dengyie/ai-register-machine"
Issues = "https://github.com/dengyie/ai-register-machine/issues"
Changelog = "https://github.com/dengyie/ai-register-machine/blob/main/CHANGELOG.md"

# application mode: uv manages deps only, no wheel build
[tool.uv]
package = false

# slidex is NOT published to PyPI (per project policy). uv resolves it from
# the public GitHub repo instead. The version constraint in [project] deps
# (slidex>=0.5.0) is checked against the repo's pyproject.toml version.
[tool.uv.sources]
slidex = { git = "https://github.com/dengyie/slidex.git" }

[tool.pytest.ini_options]
testpaths = [".", "tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
